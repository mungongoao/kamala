name: Validate application

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, fix/preserve-coordinator-and-teacher-scope]

permissions:
  contents: read

jobs:
  validate:
    name: Lint, tests and production build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Tests
        run: bun run test --passWithNoTests

      - name: Production build
        run: bun run build
